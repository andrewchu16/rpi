# Upstream to your FastAPI container
upstream fastapi_upstream {
    server api:8000;
    keepalive 32;
}

# 1) Plain HTTP: serve ACME challenges, redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.andrewchu.ca;

    # ACME HTTP-01 challenge (must stay on port 80)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2) HTTPS virtual host
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.andrewchu.ca;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;


    # Let's Encrypt certificate files
    ssl_certificate     /etc/letsencrypt/live/api.andrewchu.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.andrewchu.ca/privkey.pem;

    # Reasonable TLS settings (use Mozilla SSL Config generator for your versions)
    ssl_protocols TLSv1.2 TLSv1.3;
    # Example ciphers; generate the exact list for your Nginx/OpenSSL with Mozilla’s tool
    # https://ssl-config.mozilla.org/
    # ssl_ciphers <paste from generator>;
    # ssl_prefer_server_ciphers off;

    # Security headers (adjust as needed)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=()" always;

    # Proxy to FastAPI
    location / {
        proxy_pass http://fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Optional: bump upload size
    # client_max_body_size 10m;
}

