services:
  api:
    build: ./backend
    restart: unless-stopped
    networks: [web]
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ "ALL" ]
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend/logs:/app/logs:rw
    environment:
      - DEBUG=true
      - ALLOWED_ORIGINS=["*"]

networks:
  web:

