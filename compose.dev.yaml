services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db

  api:
    build: ./backend
    restart: unless-stopped
    networks: 
      - web
      - db
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ "ALL" ]
    volumes:
      - ./backend/logs:/app/logs:rw
    environment:
      - DEBUG=true
      - ALLOWED_ORIGINS=["*"]
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/chatdb
    depends_on:
      - postgres
    env_file:
      - path: ./.env
        required: false
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
    ports:
      - "8000:8000"
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

networks:
  web:
    driver: bridge
  db:
    driver: bridge

volumes:
  postgres_data:

