services:
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: 
      - web
      - db
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ "ALL" ]
    depends_on:
      - db
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=rpi_db
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/logs:/app/logs

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [db]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rpi_db
    volumes:
      - db_data:/var/lib/postgresql/data
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ "ALL" ]

  nginx:
    image: nginx:1.29.0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/letsencrypt:ro
      - /srv/nginx-logs:/var/log/nginx
      - nginx-cache:/var/cache/nginx
      - ./webroot:/var/www/certbot:ro
    depends_on: [api]
    networks: [web]
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ "ALL" ]
    cap_add:
      - CHOWN             # allow entrypoint to chown cache dir
      - NET_BIND_SERVICE  # allow binding to 80/443
      - SETUID            # master -> worker user drop
      - SETGID            # master -> worker group drop

  certbot:
    image: certbot/certbot:arm64v8-latest
    restart: unless-stopped
    volumes:
      - ./certs:/etc/letsencrypt
      - ./webroot:/var/www/certbot
    entrypoint: /bin/sh
      # keep the container idle until you run commands
    command: -c "sleep infinity"

networks:
  web:
    driver: bridge
  db:
    driver: bridge

volumes:
  nginx-cache:
  db_data:

